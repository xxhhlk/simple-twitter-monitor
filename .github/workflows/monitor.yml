name: WorkBuddy free activity monitor

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbuddy-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCWEET_AUTH_TOKEN: ${{ secrets.SCWEET_AUTH_TOKEN }}
      TARGET_ACCOUNT: ${{ vars.TARGET_ACCOUNT || 'WorkBuddy_AI' }}
      INITIAL_HOURS: ${{ vars.INITIAL_HOURS || '24' }}
      MAX_TWEETS_PER_FETCH: ${{ vars.MAX_TWEETS_PER_FETCH || '100' }}
      DB_PATH: monitor.db
      EXCLUDE_REPLIES: ${{ vars.EXCLUDE_REPLIES || 'true' }}
      WEBHOOK_TYPE: ${{ vars.WEBHOOK_TYPE || 'dingtalk' }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: monitor.db
          key: workbuddy-monitor-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            workbuddy-monitor-${{ github.ref_name }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one monitoring cycle
        run: python monitor.py --once
        env:
          SCWEET_DB_PATH: ${{ runner.temp }}/scweet-state.db
